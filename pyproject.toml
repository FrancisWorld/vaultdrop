[project]
name = "vaultdrop"
version = "0.1.0"
description = "Secure resumable file sharing on Amazon S3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "boto3>=1.36,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.16,<2",
]

[build-system]
requires = ["setuptools>=75,<80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaultdrop*"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "moto[s3]>=5.1,<6",
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "hypothesis>=6.125,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
