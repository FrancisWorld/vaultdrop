# Local stack: PostgreSQL + Garage (a real S3-compatible object store) + the app.
# Credentials are generated locally by scripts/dev-env.sh; nothing secret is committed.
name: vaultdrop

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: vaultdrop
      POSTGRES_DB: vaultdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdrop -d vaultdrop"]
      interval: 3s
      timeout: 3s
      retries: 20

  garage:
    build: deploy/garage # dxflrs/garage v2.1.0 pinned by digest, plus a baked-in config
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run scripts/dev-env.sh first}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run scripts/dev-env.sh first}
    volumes:
      - garage-data:/var/lib/garage
    ports:
      - "127.0.0.1:55100:3900" # S3 API, reached by the browser through presigned URLs

  storage-init:
    build: .
    depends_on:
      - garage
    restart: "no"
    environment: &storage
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run scripts/dev-env.sh first}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/dev-env.sh first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/dev-env.sh first}
      VAULTDROP_S3_BUCKET: vaultdrop-local
    command: ["python", "/app/scripts/garage_init.py"]

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:55001:8000"
    environment:
      <<: *storage
      VAULTDROP_DATABASE_URL: postgresql+psycopg://vaultdrop:${POSTGRES_PASSWORD}@postgres:5432/vaultdrop
      VAULTDROP_AWS_REGION: garage
      VAULTDROP_S3_ENDPOINT: http://garage:3900
      VAULTDROP_S3_PUBLIC_ENDPOINT: http://localhost:55100
      VAULTDROP_S3_PATH_STYLE: "true"
      VAULTDROP_S3_BOOTSTRAP: "true" # sets the bucket CORS rules for the browser
      VAULTDROP_S3_SSE: "" # Garage has no KMS; production uses aws:kms (see README)
      VAULTDROP_COOKIE_SECURE: "false" # plain http on localhost only
      VAULTDROP_ALLOWED_ORIGINS: http://localhost:55001,http://127.0.0.1:55001

volumes:
  postgres-data:
  garage-data:
