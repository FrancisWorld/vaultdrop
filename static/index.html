<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaultDrop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">VD</div>
      <div><h1>VaultDrop</h1><p>Encrypted, expiring file delivery</p></div>
    </header>
    <section class="card">
      <h2>New drop</h2>
      <label class="drop" id="drop">
        <input id="file" type="file">
        <strong id="fileName">Choose or drop a file</strong>
        <span>Encrypted locally with AES-GCM</span>
      </label>
      <div class="row">
        <label>Password <input id="password" type="password" maxlength="256"></label>
        <label>Downloads <input id="downloads" type="number" min="1" max="100000" value="5"></label>
        <label>Expires
          <select id="expires"><option value="3600">1 hour</option><option value="86400">1 day</option><option value="604800">7 days</option></select>
        </label>
      </div>
      <button id="upload">Create encrypted drop</button>
      <div id="progress" hidden><div id="bar"></div></div>
      <p id="status" role="status"></p>
      <div id="result" hidden><input id="shareUrl" readonly><button id="copy">Copy link</button></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
